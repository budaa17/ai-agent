<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="BuildWatch — барилгын төслийн AI-agent удирдлагын систем">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#0ea5e9"/>

  <g transform="translate(88 132)">
    <text font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#38bdf8" letter-spacing="2">
      БАРИЛГЫН ТӨСЛИЙН AI-AGENT УДИРДЛАГА
    </text>
    <text y="96" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="600" fill="#f8fafc">
      Өнөөдрийн ажил
    </text>
    <text y="176" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="600" fill="#f8fafc">
      төлөвлөснөөрөө явсан уу?
    </text>
    <text y="262" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#94a3b8">
      AI ноорог бэлдэнэ — инженер батална.
    </text>
  </g>

  <g transform="translate(88 470)" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">
    <text>Төлөвлө</text>
    <text x="150" fill="#475569">→</text>
    <text x="196">Бүртгэ</text>
    <text x="330" fill="#475569">→</text>
    <text x="376">Баталгаажуул</text>
    <text x="596" fill="#475569">→</text>
    <text x="642">Шийд</text>
  </g>

  <text x="1112" y="566" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#0ea5e9">
    BuildWatch
  </text>
</svg>
